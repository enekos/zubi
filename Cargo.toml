[package]
name = "zubi"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["Eneko Sarasola"]
description = "Front door for local dev servers: one binary that starts them, knows when they are ready and proxies them on one port"
license = "MIT"
repository = "https://github.com/enekosarasola/zubi"
keywords = ["dev-server", "proxy", "supervisor", "monorepo"]
categories = ["development-tools", "command-line-utilities"]

[dependencies]
anyhow = "1"
bytes = "1"
clap = { version = "4", features = ["derive"] }
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "ring", "webpki-roots", "tls12"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "server", "tokio"] }
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-perl"] }
rustix = { version = "1", features = ["process"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "process", "signal", "sync", "time", "fs"] }
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
rc_mutex = "deny"
mutex_atomic = "warn"
large_futures = "warn"
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
multiple_unsafe_ops_per_block = "deny"
mem_forget = "deny"
clone_on_ref_ptr = "warn"
large_enum_variant = "warn"
unwrap_used = "warn"
let_underscore_must_use = "warn"
dbg_macro = "deny"
todo = "deny"
allow_attributes_without_reason = "warn"
indexing_slicing = "warn"
string_slice = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
